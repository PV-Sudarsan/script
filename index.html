<!DOCTYPE html>
<html>
<head>
    <title>Microblogging App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PV-Sudarsan/script@main/micro.css">
</head>
<body>
    <h1>Microblogging App</h1>

    <form onsubmit="post(event)">
        <textarea id="t" placeholder="What's on your mind?" required></textarea>
        <button>Post</button>
    </form>

    <div id="feed"></div>

    <script src="https://cdn.jsdelivr.net/gh/PV-Sudarsan/script@0f984e8/micro.js"></script>
</body>
</html>
